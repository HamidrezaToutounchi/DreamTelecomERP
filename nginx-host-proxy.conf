# ==============================================================================
# Dream Telecom SDYS CRM - Canlı Sunucu Nginx Yapılandırması (tescom-nginx)
# Alan Adı: erp.dreamtelecom.com.tr
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. AŞAMA: HTTP (Port 80) & Otomatik HTTPS Yönlendirmesi
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name erp.dreamtelecom.com.tr;
    server_tokens off;

    client_max_body_size 50M;

    # Certbot / Let's Encrypt SSL Doğrulama Yolu (Webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # SSL sertifikanızı alana kadar bu blok aktiftir (Doğrudan uygulamayı açar):
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;

        # WebSocket (Socket.io) Desteği
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Proxy Başlıkları
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Zaman Aşımı & Güvenlik Ayarları
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # NOT: SSL sertifikanızı aldıktan sonra yukarıdaki "location /" bloğunu kapatıp
    # aşağıdaki satırın başındaki (#) işaretini kaldırarak tüm trafiği HTTPS'e yönlendiriniz:
    # return 301 https://$host$request_uri;
}

