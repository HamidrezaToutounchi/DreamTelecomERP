# ==============================================================================
# Dream Telecom SDYS CRM - Host Nginx (tescom-nginx) Yapılandırması
# ==============================================================================
# Bu yapılandırma dosyasını sunucunuzdaki Nginx konfigürasyon dizinine ekleyin.
# Genellikle: /etc/nginx/conf.d/erp.dreamtelecom.com.tr.conf
# veya tescom-nginx konteynerinin mount ettiği konfigürasyon klasörüne yerleştirin.
# ==============================================================================

# 1. HTTP Yapılandırması (ve HTTPS'e zorunlu yönlendirme)
server {
    listen 80;
    server_name erp.dreamtelecom.com.tr;

    client_max_body_size 50M;

    # Certbot SSL doğrulaması için (Let's Encrypt kullanılacaksa)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # SSL sertifikanız kurulu değilse doğrudan konteyner proxy'si:
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        
        # WebSocket Desteği (Socket.io)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # İstemci & Host Başlıkları
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Zaman aşımı limitleri
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SSL sertifikanız kurulduktan sonra HTTP -> HTTPS yönlendirmesi için yukarıdaki location / yerine:
    # return 301 https://$host$request_uri;
}

